name: Deploy to Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup SSH Key
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        
    - name: Deploy to server
      run: |
        # Debug: Check current server content
        echo "Current server content:"
        ssh -o StrictHostKeyChecking=no root@120.26.135.60 "ls -la /var/www/html"
        
        # Stop nginx temporarily
        echo "Stopping nginx..."
        ssh -o StrictHostKeyChecking=no root@120.26.135.60 "systemctl stop nginx"
        
        # Clear existing content on server
        echo "Clearing server content..."
        ssh -o StrictHostKeyChecking=no root@120.26.135.60 "rm -rf /var/www/html/*"
        
        # Copy files to server
        echo "Copying files to server..."
        rsync -avz --exclude '.git' \
          -e "ssh -o StrictHostKeyChecking=no" \
          ./ root@120.26.135.60:/var/www/html/
        
        # Verify copied files
        echo "Files copied to server:"
        ssh -o StrictHostKeyChecking=no root@120.26.135.60 "ls -la /var/www/html"
        
        # Set proper permissions and restart nginx
        ssh -o StrictHostKeyChecking=no root@120.26.135.60 << 'ENDSSH'
          # Set proper ownership and permissions
          chown -R www-data:www-data /var/www/html
          chmod -R 755 /var/www/html
          
          # Check nginx configuration
          nginx -t
          
          # Start nginx
          systemctl start nginx
          systemctl status nginx
          
          echo "Deployment completed successfully!"
ENDSSH