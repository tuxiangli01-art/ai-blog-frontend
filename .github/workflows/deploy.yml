name: Deploy to Alibaba Cloud

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: |
        npm ci || npm install
      continue-on-error: true
      
    - name: Build project (if build script exists)
      run: |
        npm run build || echo "No build script, using static files"
      continue-on-error: true
      
    - name: Deploy to Alibaba Cloud via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.REMOTE_HOST }}
        username: ${{ secrets.REMOTE_USER }}
        password: ${{ secrets.REMOTE_PASSWORD }}
        # 或者使用SSH密钥：
        # key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          echo "===== 开始部署 ====="
          
          # 确保目录存在
          mkdir -p /var/www/nolan-blog
          
          # 备份旧版本
          if [ -d "/var/www/nolan-blog" ] && [ "$(ls -A /var/www/nolan-blog)" ]; then
            echo "备份旧版本..."
            tar -czf /var/www/nolan-blog-backup-$(date +%Y%m%d-%H%M%S).tar.gz -C /var/www nolan-blog
          fi
          
          echo "部署完成！"
          
    - name: Deploy files via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.REMOTE_HOST }}
        username: ${{ secrets.REMOTE_USER }}
        password: ${{ secrets.REMOTE_PASSWORD }}
        # 或者使用SSH密钥：
        # key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        source: "."
        target: "/var/www/nolan-blog"
        strip_components: 0
        rm: true
        
    - name: Restart Nginx
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.REMOTE_HOST }}
        username: ${{ secrets.REMOTE_USER }}
        password: ${{ secrets.REMOTE_PASSWORD }}
        # 或者使用SSH密钥：
        # key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          echo "===== 重启 Nginx ====="
          sudo nginx -t && sudo systemctl restart nginx
          echo "===== 部署完成 ====="
          echo "网站地址: http://${{ secrets.REMOTE_HOST }}"
          
    - name: Deployment Notification
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ 部署成功！"
        else
          echo "❌ 部署失败，请检查日志"
        fi